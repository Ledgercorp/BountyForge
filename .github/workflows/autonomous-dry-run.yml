name: BountyForge read-only regression and discovery

# No cron until a financial hard-stop and the full runner safety envelope are verified.
on:
  pull_request:
    branches: [main]
    paths:
      - 'bountyforge/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - '.github/workflows/autonomous-dry-run.yml'
  workflow_dispatch:
    inputs:
      discovery:
        description: Offline demo or read-only live GitHub discovery
        required: true
        type: choice
        default: offline
        options:
          - offline
          - live

permissions:
  contents: read

concurrency:
  group: bountyforge-bounded-dry-run
  cancel-in-progress: false

jobs:
  safe-scan:
    # Never run source supplied by arbitrary public fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without reusable credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full standard-library regression
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m unittest discover -s benchmarks/phase4 -v
      - name: Bounded discovery and machine-readable evidence
        env:
          BOUNTYFORGE_SUBMIT_ENABLED: '0'
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'pull_request' && 'offline' || inputs.discovery }}
        run: |
          set -euo pipefail
          mkdir -p evidence-run
          python -m scripts.autonomous_cycle --scan "$MODE" --output evidence-run/cycle.json
          python -m scripts.validate_evidence evidence-run/cycle.json
      - name: Upload sanitized evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bountyforge-dry-run-${{ github.run_id }}
          path: evidence-run/cycle.json
          retention-days: 2
