name: BountyForge DeepSeek handoff contract (offline)

# Tests only. No SDK, model requests, Docker launch, credentials, uploads or schedules.
on:
  pull_request:
    branches: [engineering/revenue-linux-scout-20261021]
    paths:
      - 'deepseek_harness_handoff.py'
      - 'deepseek_owned_bridge.py'
      - 'tests/test_deepseek_handoff.py'
      - 'tests/test_deepseek_owned_bridge.py'
      - '.github/workflows/deepseek-handoff-contract.yml'

permissions:
  contents: read

jobs:
  handoff-tests:
    if: ${{ github.repository == 'Ledgercorp/BountyForge' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'engineering/deepseek-handoff-20261023' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Focused handoff and trusted-bridge tests (no inference)
        run: python3 -m unittest discover -s tests -p 'test_deepseek*.py' -v
      - name: Existing Python regression (no model downloads)
        run: python3 -m unittest discover -s tests -v
