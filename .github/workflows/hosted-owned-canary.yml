name: BountyForge hosted owned-fixture canary

# No schedule, no production activation, no outside source execution or payouts.
# The live model path requires an explicit manual dispatch and owner attestation.
on:
  push:
    branches: [engineering/revenue-linux-scout-20261021]
    paths:
      - '.github/workflows/hosted-owned-canary.yml'
      - 'bountyforge/groq_adapter.py'
      - 'tests/test_groq_adapter.py'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Send approved owned fixture source to Groq Free Plan (no paid account)'
        required: true
        type: boolean
        default: false
      suite:
        description: 'Frozen owned development suite (never customer or external source)'
        required: true
        type: choice
        options: [structural, original]
        default: structural

permissions:
  contents: read

concurrency:
  group: bountyforge-repair-worker
  cancel-in-progress: false

jobs:
  safe-offline-check:
    if: ${{ github.repository == 'Ledgercorp/BountyForge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Mocked hosted transport checks (no external model calls)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_groq_adapter.py' -v
          python -m unittest discover -s tests -p 'test_owned_canary*.py' -v
          python -m unittest discover -s tests -p 'test_phase5_development.py' -v


  credential-metadata-only-probe:
    # One read-only API metadata call on this exact authorized diagnostic commit.
    # No model inference, no source execution and no provider response-body logging.
    if: ${{ github.repository == 'Ledgercorp/BountyForge' && github.ref == 'refs/heads/engineering/revenue-linux-scout-20261021' && github.event_name == 'push' && github.event.head_commit.message == '[bf-groq-model-metadata-probe-once]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Validate the scoped Groq key using GET models metadata only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get('GROQ_API_KEY', '')
          if not key:
              raise SystemExit('metadata_probe: missing_secret')
          class DenyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, url):
                  raise RuntimeError('redirect forbidden')
          request = urllib.request.Request('https://api.groq.com/openai/v1/models',
              headers={'Authorization': 'Bearer ' + key,
                       'User-Agent': 'BountyForge-Owned-Metadata/1'}, method='GET')
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}), DenyRedirect())
          try:
              with opener.open(request, timeout=15) as response:
                  raw=response.read(65537)
                  status=response.status
              if len(raw)>65536:raise ValueError('oversize')
              data=json.loads(raw)
              if not isinstance(data,dict) or not isinstance(data.get('data'),list):
                  raise ValueError('unexpected metadata')
              available=any(isinstance(x,dict) and x.get('id')=='openai/gpt-oss-120b'
                  for x in data['data'])
              print('metadata_probe: http_200; target_listed=' + str(available).lower())
          except urllib.error.HTTPError as exc:
              code = exc.code if type(exc.code) is int and 100 <= exc.code <= 599 else 0
              print('metadata_probe: http_' + str(code) + '; target_listed=unknown')
          except Exception:
              print('metadata_probe: transport_or_schema_error; target_listed=unknown')
          PY

  explicitly-approved-owned-model:
    needs: safe-offline-check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live == true && github.repository == 'Ledgercorp/BountyForge' && github.ref == 'refs/heads/engineering/revenue-linux-scout-20261021' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BOUNTYFORGE_GROQ_FREE_PLAN_ATTESTED: ${{ vars.BOUNTYFORGE_GROQ_FREE_PLAN_ATTESTED }}
      BOUNTYFORGE_OWNED_SUITE: ${{ inputs.suite || 'structural' }}
      BOUNTYFORGE_SUBMIT_ENABLED: '0'
      BOUNTYFORGE_CURATED_DOCKER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fail closed unless the current account Free Plan is attested
        run: |
          set -euo pipefail
          [[ "$BOUNTYFORGE_GROQ_FREE_PLAN_ATTESTED" == '1' ]] || exit 2
      - name: Pull immutable isolated Python runtime
        run: docker pull --platform linux/amd64 python@sha256:8a00ecb83ed9d0864dfd102a1bdb2067fda907ceb30bb86d09da9ee558b19590
      - name: Prove Docker admission before exposing the inference credential
        run: |
          set -euo pipefail
          mkdir -p hosted-evidence
          python - <<'PY'
          import json, shutil, tempfile
          from pathlib import Path
          from bountyforge.curated_docker import MARKER, verify_runtime_boundary
          with tempfile.TemporaryDirectory(prefix='bf-hosted-owned-probe-') as directory:
              root = Path(directory) / 'baseline'
              shutil.copytree('benchmarks/phase4/tasks/459', root)
              (root / MARKER).write_text('459')
              proof = verify_runtime_boundary(root)
          Path('hosted-evidence/sandbox-preflight.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Bounded owned-fixture Python repair evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$GROQ_API_KEY" ]] || exit 2
          mkdir -p hosted-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from bountyforge.groq_adapter import HostedGroqModel, MODEL_ID
          from benchmarks.phase5.development_runner import run
          from scripts.validate_owned_canary import validate_owned_canary
          # Separate total reasoning allowance from the unchanged line-patch limit.
          model = HostedGroqModel(total_generation_tokens=1024, minimum_interval_seconds=60)
          output = Path('hosted-evidence/groq-owned-v5.json')
          suite = os.environ['BOUNTYFORGE_OWNED_SUITE']
          result = run(model=model, protocol='ast_contract_v5', suite=suite, output=output)
          result['inference_backend'] = {'provider': 'groq', 'model': MODEL_ID,
                                         'transport_calls': model.calls,
                                         'total_generation_tokens_per_call': 1024,
                                         'minimum_interval_seconds': 60}
          output.write_text(json.dumps(result, indent=2, ensure_ascii=True) + '\n')
          validated = validate_owned_canary(result, suite=suite, expected_revision=os.environ['GITHUB_SHA'])
          print('Completed owned experiment:', json.dumps(validated, sort_keys=True))
          PY
      - name: Independently replay reported successes without provider credentials
        run: |
          set -euo pipefail
          python -m scripts.replay_owned_canary hosted-evidence/groq-owned-v5.json \
            --suite "$BOUNTYFORGE_OWNED_SUITE" --revision "$GITHUB_SHA" \
            --output hosted-evidence/groq-owned-replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bountyforge-owned-groq-${{ github.run_id }}
          path: |
            hosted-evidence/groq-owned-v5.json
            hosted-evidence/sandbox-preflight.json
            hosted-evidence/groq-owned-replay.json
          if-no-files-found: ignore
          retention-days: 2
