name: BountyForge manual discovery (read only)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bountyforge-manual-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan public GitHub issue candidates without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bountyforge.cli scan --limit 8 --output reports/scan.json --summary "${GITHUB_STEP_SUMMARY}"
