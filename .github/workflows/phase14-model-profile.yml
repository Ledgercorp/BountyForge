name: BountyForge Phase14 bounded 7B CPU feasibility
on:
  push:
    branches: [engineering/revenue-linux-scout-20261021]
    paths: ['.github/workflows/phase14-model-profile.yml']
  workflow_dispatch:
    inputs:
      confirm_zero_cost:
        description: One 96-token resource probe, no model replacement or repair accuracy claim
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: bountyforge-repair-worker
  cancel-in-progress: false
jobs:
  resource-probe:
    if: >-
      github.repository == 'Ledgercorp/BountyForge' && github.event.repository.private == false &&
      github.ref == 'refs/heads/engineering/revenue-linux-scout-20261021' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm_zero_cost) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[phase14-model-profile]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_phase14_model_profile -q
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/bountyforge/models
          key: bountyforge-public-qwen25-coder-1p5b-cc324af0-v1
      - run: bash scripts/bootstrap_actions_inference.sh --verify-only
      - name: Download one pinned 7B packaging to disposable storage only
        run: |
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 300 \
            'https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf' \
            -o "$RUNNER_TEMP/bf14-qwen7b.gguf"
      - name: Profile with no inherited credentials, 10GiB address-space limit and one call
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY=Ledgercorp/BountyForge \
            GITHUB_REF=refs/heads/engineering/revenue-linux-scout-20261021 \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" RUNNER_OS=Linux RUNNER_ARCH=X64 \
            BOUNTYFORGE_MODEL_PROFILE_ACK=true LD_LIBRARY_PATH="$pythonLocation/lib" \
            "$pythonLocation/bin/python" -m scripts.phase14_model_profile --output evidence-run/model_profile.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bountyforge-phase14-7b-${{ github.run_id }}
          path: evidence-run/model_profile.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Delete disposable model and bounded log
        if: always()
        run: rm -f -- "$RUNNER_TEMP/bf14-qwen7b.gguf" "$RUNNER_TEMP/bf14-7b-server.log"
