name: BountyForge next-generation owned model comparison
on:
  workflow_dispatch:
    inputs:
      confirm_zero_cost:
        description: Only the two previously unattempted Granite tasks; four completion requests maximum
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: bountyforge-repair-worker
  cancel-in-progress: false
jobs:
  comparison:
    if: >-
      github.repository == 'Ledgercorp/BountyForge' && github.event.repository.private == false &&
      github.ref == 'refs/heads/engineering/revenue-linux-scout-20261021' &&
      github.event_name == 'workflow_dispatch' && inputs.confirm_zero_cost
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Contract tests and no-charge standard runner capacity gate
        run: |
          python -c "from scripts.nextgen_comparison import verify_experiment; verify_experiment('77709bd5ee7b858dc5c1fbc5af2599d617086209ef5551aedf8734c5ba400f11','granite-continuation')"
          python -m unittest tests.test_nextgen_repair tests.test_model_profiles tests.test_local_model_runtime tests.test_profiled_qwen tests.test_owned_repair_queue tests.test_mcp_stdio_blackbox -q
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          available=int(next(r.split()[1] for r in Path('/proc/meminfo').read_text().splitlines() if r.startswith('MemAvailable:')))
          assert (os.cpu_count() or 0)>=4 and available>=12*1024**2
          assert shutil.disk_usage(Path.home()).free>=10*1024**3
          print('Public standard Linux CPU runner; no provider or paid runner')
          PY
      - name: Acquire only the pinned runtime and Granite data; no cache writes
        run: |
          mkdir -p "$HOME/.cache/bountyforge/runtime" "$HOME/.cache/bountyforge/models"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 300 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz' \
            -o "$HOME/.cache/bountyforge/runtime/llama-b11750-bin-ubuntu-x64.tar.gz"
          printf '152e33221c9c9d37816a8ee9943f8d87339199197c80cb692559c9756b2027d8  %s\n' "$HOME/.cache/bountyforge/runtime/llama-b11750-bin-ubuntu-x64.tar.gz" | sha256sum -c -
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 300 \
            'https://huggingface.co/ibm-granite/granite-4.2-3b-GGUF/resolve/c40945d71cd90f249a56985e8155551a9188dc30/granite-4.2-3b-Q4_K_M.gguf' \
            -o "$HOME/.cache/bountyforge/models/granite-4.2-3b-Q4_K_M.gguf"
          printf 'e0406663965846ae22a403456eb826ccce5f450840491f71952f18a7cb78e7d5  %s\n' "$HOME/.cache/bountyforge/models/granite-4.2-3b-Q4_K_M.gguf" | sha256sum -c -
      - name: Pull unchanged owned-verifier image
        run: docker pull --platform linux/amd64 python@sha256:8a00ecb83ed9d0864dfd102a1bdb2067fda907ceb30bb86d09da9ee558b19590
      - name: Sequential owned queue experiment; remove inherited credentials
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY=Ledgercorp/BountyForge \
            GITHUB_REF=refs/heads/engineering/revenue-linux-scout-20261021 \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" RUNNER_OS=Linux RUNNER_ARCH=X64 \
            BOUNTYFORGE_NEXTGEN_FREE_ACK=true LD_LIBRARY_PATH="$pythonLocation/lib" \
            "$pythonLocation/bin/python" -m scripts.nextgen_comparison \
            --experiment granite-continuation --experiment-sha256 77709bd5ee7b858dc5c1fbc5af2599d617086209ef5551aedf8734c5ba400f11 --output evidence-run/nextgen_comparison.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bountyforge-nextgen-comparison-${{ github.run_id }}
          path: evidence-run/nextgen_comparison.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Delete only disposable experimental weights
        if: always()
        run: rm -f -- "$HOME/.cache/bountyforge/models/Qwen3.5-4B-Q4_K_M.gguf" "$HOME/.cache/bountyforge/models/granite-4.2-3b-Q4_K_M.gguf"
