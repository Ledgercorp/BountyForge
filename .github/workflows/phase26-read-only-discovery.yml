name: Phase26 read-only discovery acceptance

on:
  pull_request:
    branches: [engineering/phase23-25-readiness-20261026]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: phase26-read-only-discovery
  cancel-in-progress: false

jobs:
  model-free-acceptance:
    if: ${{ github.repository == 'Ledgercorp/BountyForge' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'engineering/phase26-real-bounty-pilot-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Admit exact existing owned-fixture Docker image
        run: docker pull python@sha256:8a00ecb83ed9d0864dfd102a1bdb2067fda907ceb30bb86d09da9ee558b19590
      - name: Full model-free Python regression and owned Docker controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BOUNTYFORGE_PHASE8_DEV_DOCKER: "1"
          BOUNTYFORGE_PHASE8_DEV_EVIDENCE: ${{ runner.temp }}/phase26-owned-docker.json
        run: python3 -m unittest discover -s tests -v
      - name: Verify frozen historical registry without execution
        run: python3 -m scripts.verify_historical_registry
      - name: Rehearse the existing synthetic queue and payment denials
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/bf26-state" "$RUNNER_TEMP/bf26-evidence"
          python3 -m scripts.crypto_work rehearse --admit-owned-simulation --state-dir "$RUNNER_TEMP/bf26-state" --output "$RUNNER_TEMP/bf26-evidence/rehearsal-first.json"
          python3 -m scripts.crypto_work rehearse --admit-owned-simulation --state-dir "$RUNNER_TEMP/bf26-state" --output "$RUNNER_TEMP/bf26-evidence/rehearsal-after-restart.json"
      - name: Node console regression
        run: node --test tests/dashboard_state.mjs tests/repair_console.cjs
      - name: Upload small model-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase26-read-only-acceptance
          path: |
            ${{ runner.temp }}/phase26-owned-docker.json
            ${{ runner.temp }}/bf26-evidence/*.json
          retention-days: 1
          if-no-files-found: ignore
