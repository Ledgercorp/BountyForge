# Additive to the unchanged Phase17 forbidden-tool/log-upload profile.
- insert:
    - id: bountyforge-local-provider
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          bountyforge-local-qwen:
            api: openai-completions
            baseURL: http://127.0.0.1:8081/v1
            apiKeyEnv: BOUNTYFORGE_LOCAL_NO_CREDENTIAL
            models:
              - id: bountyforge-qwen-1.5b
                contextWindow: 2048
                maxTokens: 150
                reasoningEfforts: false
                input: [text]
            timeoutMs: 45000
            streamIdleTimeoutMs: 45000
            compat:
              supportsDeveloperRole: false
              supportsStore: false
              maxTokensField: max_tokens
    - id: bountyforge-native-policy
      name: /workspace/native-policy.mjs
